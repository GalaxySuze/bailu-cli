# ~/.ai-workflow/workflows/ops-workflow.yaml
# 自媒体运营工作流配置

workflow:
  name: "自媒体运营工作流"
  description: "主题探索与澄清 → 区分形式 → 内容创作 → 人工确认 → 手动发布"
  enabled: true

# ============================================================
# 平台规范
# ============================================================
platforms:
  xiaohongshu:
    name: "小红书"
    cover_size: "1080x1440"
    content_size: "1080x1440"
    title_max: 20
    content_max: 1000
    format: "jpg/png"
  douyin:
    name: "抖音"
    video_ratio: "9:16"
    duration: "15-60秒"
  wechat:
    name: "公众号"
    cover_size: "900x383"
    content_width: "1080"

# ============================================================
# 阶段1：主题探索与澄清
# ============================================================
stage1:
  name: "主题探索与澄清"
  description: "确定内容主题、目标受众、核心价值"
  
  tools:
    - brainstorming
    - market-research
  
  checkpoints:
    - name: "主题确认"
      trigger: "主题探索完成后"
      action: "用户确认内容主题和角度"
  
  outputs:
    path: "content/{date}-{topic}/"
    file: "topic-brief.md"

# ============================================================
# 阶段2：形式判定
# ============================================================
stage2:
  name: "形式判定"
  description: "区分这次发图文还是视频"
  
  decision_tree:
    image:
      conditions:
        - "信息密度高"
        - "需要快速浏览"
        - "教程类内容"
      tools:
        - frontend-design
        - banner-design
        - slides
    video_ppt:
      conditions:
        - "需要口播讲解"
        - "知识分享类"
        - "产品介绍"
      tools:
        - frontend-slides
        - guizang-ppt-skill
    video_story:
      conditions:
        - "需要故事性"
        - "情感共鸣类"
        - "案例分享"
      tools:
        - article-writing
        - content-engine
  
  checkpoints:
    - name: "形式确认"
      trigger: "形式判定完成后"
      action: "用户确认选择图文还是视频"

# ============================================================
# 阶段3：内容创作
# ============================================================
stage3:
  name: "内容创作"
  description: "根据形式创建内容"
  
  image_branch:
    tools:
      - frontend-design
      - banner-design
      - design
      - slides
    outputs:
      - type: "cover"
        description: "封面图"
        specs: "1080x1440"
      - type: "content_images"
        description: "内容图片"
        specs: "1080x1440"
      - type: "article_to_image"
        description: "文章转图片"
        format: "多张图片序列"
  
  video_ppt_branch:
    tools:
      - frontend-slides
      - guizang-ppt-skill
      - slides
    outputs:
      - type: "html_ppt"
        description: "HTML PPT文件"
      - type: "script"
        description: "口播脚本"
  
  video_story_branch:
    tools:
      - article-writing
      - content-engine
      - frontend-design
    outputs:
      - type: "script"
        description: "视频脚本"
      - type: "storyboard"
        description: "分镜脚本"
      - type: "video_assets"
        description: "视频素材清单"
  
  checkpoints:
    - name: "内容确认"
      trigger: "内容创作完成后"
      action: "用户确认内容质量"

# ============================================================
# 阶段4：发布准备
# ============================================================
stage4:
  name: "发布准备"
  description: "检查内容质量，准备发布"
  
  checklist:
    - "标题是否吸引人"
    - "封面图是否清晰"
    - "内容是否符合平台规范"
    - "标签是否合适"
    - "发布时间是否合适"
  
  checkpoints:
    - name: "最终确认"
      trigger: "所有内容创作完成后"
      action: "用户确认可以发布"
      note: "不自动发布，用户手动发布到运营平台"

# ============================================================
# 人工节点规则
# ============================================================
human_rules:
  - "内容创作完成后必须人工确认"
  - "涉及敏感话题必须人工确认"
  - "发布操作必须人工执行"
