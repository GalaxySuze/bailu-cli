# 白鹿开发工作流 v2.0 — SDD 七阶段
# 互斥引擎架构：SDD（默认）/ Comet（v3.0）/ 白鹿原生（fallback）

workflow:
  name: "白鹿开发工作流（SDD 增强版）"
  version: "2.0.0"
  description: "SDD 七阶段研发管理，覆盖从需求到上线的完整链路"
  enabled: true

# ============================================================
# 引擎选择
# ============================================================
engine:
  current: sdd                    # sdd / comet / bare
  description: "当前激活的流程引擎，通过 bailu install dev --engine 切换"

# ============================================================
# SDD 研发管理配置
# ============================================================
sdd:
  enabled: true
  state_dir: ".sdd"
  state_file: "sdd-context.md"

  # 三级规模路由
  scale_levels:
    small:
      label: "小需求（快速模式）"
      phases: [D1, D4, D5, D6]
      skip_phases: [D2, D3]
      d4_mode: "quick"
      estimated_rounds: "1-2 轮对话"

    medium:
      label: "中等需求（标准模式）"
      phases: [D1, D2, D3, D4, D5, D6]
      d3_mode: "ai-self-check"
      d4_mode: "standard"
      estimated_rounds: "3-5 轮对话"

    large:
      label: "大需求（完整模式）"
      phases: [D1, D2, D3, D4, D5, D6, D7]
      d3_mode: "formal-review"
      d4_mode: "standard"
      estimated_rounds: "多天多轮对话"

  # 规模自动判定（启发式规则）
  scale_rules:
    signal_based:
      small: ["加一个", "改一下", "纯前端样式", "无接口变更", "单一功能点"]
      medium: ["有接口新增/变更", "前后端协作", "涉及多个模块", "有DB改动"]
      large: ["新建系统/子系统", "跨团队协作", "改动量大", "明确提到需要评审"]
      ambiguous: medium              # 描述模糊时保守推荐中等
    file_scan:
      small: "涉及文件 ≤ 2 且无接口变更"
      medium: "涉及文件 3-5 或有 1-2 个接口变更"
      large: "涉及文件 > 5 或新建模块"
    conflict_resolution: conservative  # 信号冲突时保守推荐更大规模

  # OpenSpec 使用时机判断
  openspec_decision:
    enabled: true
    auto_recommend: true
    require_conditions:
      - "多文件功能开发（3+ 文件）"
      - "破坏性变更（API / DB Schema / 中间件）"
      - "需要设计决策的工作"
      - "跨领域架构变更"
    skip_conditions:
      - "简单 Bug 修复"
      - "微小调整（参数/配置/样式）"
      - "显而易见的重构"
      - "单行文字修改"
    override: "用户可手动覆盖自动推荐"

  # 阶段定义
  phases:
    D1:
      name: "任务分配与评估"
      skill: "bailu-sdd-d1-planning"
      agent: "planner"
      outputs:
        - "任务清单（Markdown 表格）"
        - "SP 汇总统计"
      checkpoints:
        - name: "任务拆解确认"
          trigger: "任务清单生成后"
          action: "等待用户确认任务拆解合理性"

    D2:
      name: "技术方案设计"
      skill: "bailu-sdd-d2-tech-design"
      agent: "architect"
      outputs:
        - "openspec/changes/<name>/proposal.md"
        - "openspec/changes/<name>/design.md"
        - "openspec/changes/<name>/tasks.md"
      checkpoints:
        - name: "设计方案确认"
          trigger: "design.md 生成后"
          action: "等待用户确认技术方案"

    D3:
      name: "技术方案评审"
      skill: "bailu-sdd-d3-tech-review"
      agent: "code-reviewer"
      modes:
        ai-self-check:
          description: "AI 根据 design.md 动态生成 checklist 做自检"
          applicable: [medium]
        formal-review:
          description: "正式评审会，录入评审人/结论/意见"
          applicable: [large]
      outputs:
        - "openspec/changes/<name>/review.md"
      checkpoints:
        - name: "评审结论确认"
          trigger: "评审完成后"
          action: "确认通过/有条件通过/不通过"

    D4:
      name: "开发编码"
      skill: "bailu-sdd-d4-coding"
      agent: "backend-developer, frontend-developer"
      sub_skills:
        - "bailu-sdd-d4-git-branch"
      modes:
        quick:
          description: "扫代码→会话内确认改动范围→写代码"
          applicable: [small]
        standard:
          description: "OpenSpec artifacts + 逐任务执行"
          applicable: [medium, large]
      checkpoints:
        - name: "改动范围确认"
          trigger: "小需求模式下代码扫描完成后"
          action: "等待用户确认改动范围"
        - name: "关键决策点"
          trigger: "遇到设计冲突/多实现路径/新依赖时"
          action: "暂停询问用户"

    D5:
      name: "代码评审"
      skill: "bailu-sdd-d5-code-review"
      agent: "code-reviewer"
      gates:
        - name: "AI 代码审核"
          dimensions: ["代码规范", "安全漏洞", "性能", "业务逻辑", "异常处理", "可维护性"]
        - name: "人工代码审核"
          description: "评审人阅读 AI 摘要和 diff 给出结论"
      checkpoints:
        - name: "评审通过确认"
          trigger: "AI 审核 + 人工审核均通过后"

    D6:
      name: "测试与缺陷闭环"
      skill: "bailu-sdd-d6-test-closure"
      agent: "test-engineer"
      test_phases:
        - "单元测试"
        - "本地功能自测"
        - "前后端联调"
        - "三方接口联调"
      checkpoints:
        - name: "缺陷闭环确认"
          trigger: "所有测试完成后"
          action: "确认所有问题已修复"

    D7:
      name: "上线/发版"
      skill: "bailu-sdd-d7-publish"
      agent: "code-reviewer"
      optional: true
      checklist:
        - "分支检查"
        - "变更检查"
        - "提交记录检查"
        - "发布风险检查"

# ============================================================
# Fallback：白鹿原生四阶段（SDD 不可用时）
# ============================================================
fallback:
  enabled: true
  description: "当 SDD Skills 不可用时，回退到白鹿原生推荐式流程"

  stage1:
    name: "需求讨论与澄清"
    tools: [brainstorming, product-requirements, search-first]
    checkpoints:
      - name: "问题清单确认"
      - name: "方案方向确认"

  stage2:
    name: "方案文档生成"
    tools: [writing-plans, mermaid-visualizer, excalidraw-diagram]
    checkpoints:
      - name: "架构确认"
      - name: "任务确认"

  stage3:
    name: "AI Coding"
    tools: [subagent-driven-development, test-driven-development, systematic-debugging, codex]
    checkpoints:
      - name: "阻塞确认"
      - name: "Review确认"

  stage4:
    name: "交付"
    tools: [requesting-code-review, verification-before-completion, obsidian-cli]
    checkpoints:
      - name: "最终验收"

# ============================================================
# 决策追溯配置
# ============================================================
decisions:
  base_path: "~/.bailu/knowledge-base/projects"
  auto_record:
    - requirement_clarification
    - tech_selection
    - architecture_design
    - implementation_approach
    - review_conclusion           # 新增：评审结论
    - code_review_finding         # 新增：代码评审发现
    - test_defect                 # 新增：测试缺陷
