# ~/.ai-workflow/workflows/dev-workflow.yaml
# AI Coding 开发工作流配置

workflow:
  name: "AI Coding 开发工作流"
  description: "需求讨论与澄清 → 方案文档生成 → AI Coding → 交付"
  enabled: true

# ============================================================
# 阶段1：需求讨论与澄清
# ============================================================
stage1:
  name: "需求讨论与澄清"
  description: "Deep Interview、多方评审、方案对比"
  
  tools:
    - brainstorming
    - product-requirements
    - search-first
  
  checkpoints:
    - name: "问题清单确认"
      trigger: "Deep Interview完成后"
      action: "等待用户确认问题是否完整"
    - name: "方案方向确认"
      trigger: "综合分析完成后"
      action: "等待用户选择技术方案"
  
  outputs:
    path: "projects/{project}/specs/"
    pattern: "YYYY-MM-DD-<topic>-design.md"

# ============================================================
# 阶段2：方案文档生成
# ============================================================
stage2:
  name: "方案文档生成"
  description: "技术架构、业务需求、功能模块、任务拆分"
  
  tools:
    - writing-plans
    - mermaid-visualizer
    - excalidraw-diagram
  
  checkpoints:
    - name: "架构确认"
      trigger: "技术架构设计完成后"
    - name: "任务确认"
      trigger: "开发任务拆分完成后"
  
  outputs:
    path: "projects/{project}/docs/"
    files:
      - tech-architecture.md
      - business-analysis.md
      - module-design.md
      - task-breakdown.md

# ============================================================
# 阶段3：AI Coding
# ============================================================
stage3:
  name: "AI Coding"
  description: "子Agent执行、代码Review、测试"
  
  tools:
    - subagent-driven-development
    - test-driven-development
    - systematic-debugging
    - codex
  
  checkpoints:
    - name: "阻塞确认"
      trigger: "遇到阻塞问题时"
    - name: "Review确认"
      trigger: "代码review完成后"
      action: "用户查看diff，确认后手动push"
  
  execution:
    mode: "hybrid"
    primary_coder: "claude"
    reviewer: "codex"
    auto_push: false

# ============================================================
# 阶段4：交付
# ============================================================
stage4:
  name: "交付"
  description: "代码审查、文档更新、知识沉淀"
  
  tools:
    - requesting-code-review
    - verification-before-completion
    - obsidian-cli
  
  checkpoints:
    - name: "最终验收"
      trigger: "所有任务完成后"

# ============================================================
# 决策追溯配置
# ============================================================
decisions:
  base_path: "/Users/kangkang/知识库/my-wiki/projects"
  auto_record:
    - requirement_clarification
    - tech_selection
    - architecture_design
    - implementation_approach
